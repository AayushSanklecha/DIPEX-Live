[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "dipex"
version = "3.0.0"
description = "DIPEX — Data Intelligence Platform for Expert Analysis: AI-augmented, RL-governed, enterprise-grade data analytics platform."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary — DIP2026-23191 Research Programme" }
authors = [
    { name = "DIPEX Research Team" },
]
keywords = [
    "data-analytics", "machine-learning", "reinforcement-learning",
    "data-quality", "enterprise-analytics", "llm-governance",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]
# Core runtime deps (full list in requirements.txt)
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.27.0",
]

[project.scripts]
dipex = "main:cli"

[project.optional-dependencies]
# pip install dipex[rag]
rag = [
    "chromadb>=0.5.0",
    "sentence-transformers>=2.7.0",
]
# pip install dipex[streaming]
streaming = [
    "confluent-kafka>=2.3.0",
]
# pip install dipex[formats]
formats = [
    "fastavro>=1.8.0",
    "pyarrow>=14.0.0",
    "openpyxl>=3.1.0",
]
# pip install dipex[llm]
llm = [
    "openai>=1.0.0",
    "anthropic>=0.20.0",
]
# pip install dipex[dev] — everything for development + testing
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "hypothesis[pandas]>=6.92.0",
    "ruff>=0.3.0",
    "black>=24.0.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
# Auto-discover all packages; exclude notebooks and test fixtures
exclude = ["tests*", "notebooks*", "scripts*", "dashboard*", "docs*", "monitoring*"]

[tool.pytest.ini_options]
# pytest config lives in pytest.ini — kept separate for clarity

[tool.ruff]
line-length = 110
target-version = "py39"
exclude = ["notebooks/", "scripts/", ".venv/", "build/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",   # line too long — handled by formatter
    "E712",   # == True comparisons — some test assertions use this
    "F401",   # unused imports — some intentional re-exports in __init__.py files
]
