version: "3.9"

services:
  # ── DIPEX API ──────────────────────────────────────────────────────────────
  dipex-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: dipex-api:latest
    container_name: dipex-api
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-CHANGE-ME-IN-PRODUCTION-minimum-32-chars!!!}
      - JWT_EXPIRE_MINS=${JWT_EXPIRE_MINS:-60}
      - DIPEX_ENV=${DIPEX_ENV:-production}
      - LLM_PROVIDER=${LLM_PROVIDER:-fallback}
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM:-120}
      - RATE_LIMIT_BURST=${RATE_LIMIT_BURST:-20}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - POSTGRES_URI=postgresql://admin:supersecret@postgres:5432/dipex
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASS=supersecret
      - MODEL_REGISTRY_PATH=/app/data/model_registry
    volumes:
      - dipex-data:/app/data
      - dipex-audit:/app/audit
      - dipex-reports:/app/reports
      - dipex-governance:/app/governance
    healthcheck:
      # Use Python stdlib urllib — curl is not installed in the runtime image
      test: [ "CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/health'); sys.exit(0)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dipex-net

  # ── MongoDB (NoSQL Document Store) ────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: dipex-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-supersecret}
      MONGO_INITDB_DATABASE: dipex
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - dipex-net

  # ── Redis (Key-Value Store / Cache / Pub-Sub) ─────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: dipex-redis
    ports:
      - "6379:6379"
    command: >
      redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes --requirepass ${REDIS_PASSWORD:-dipexredis}
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dipexredis}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - dipex-net

  # ── Dashboard static server ────────────────────────────────────────────────
  dipex-dashboard:
    image: nginx:alpine
    container_name: dipex-dashboard
    ports:
      - "3000:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - dipex-api
    restart: unless-stopped
    networks:
      - dipex-net

  # ── Kafka (Streaming) ──────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: dipex-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: [ "CMD", "echo", "ruok", "|", "nc", "localhost", "2181" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dipex-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: dipex-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: [ "CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - dipex-net

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: dipex-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: supersecret
      POSTGRES_DB: dipex
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "admin", "-d", "dipex" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dipex-net

  # ── Neo4j ──────────────────────────────────────────────────────────────────
  neo4j:
    image: neo4j:5.12.0
    container_name: dipex-neo4j
    environment:
      NEO4J_AUTH: neo4j/supersecret
    ports:
      - "7474:7474" # HTTP admin panel
      - "7687:7687" # Bolt protocol
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7474" ]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - dipex-net

  # ── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: dipex-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--storage.tsdb.retention.time=30d"
    restart: unless-stopped
    networks:
      - dipex-net

  # ── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.2.0
    container_name: dipex-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-dipex-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - dipex-net

volumes:
  dipex-data:
  dipex-audit:
  dipex-reports:
  dipex-governance:
  prometheus-data:
  grafana-data:
  postgres-data:
  neo4j-data:
  mongo-data:
  redis-data:


networks:
  dipex-net:
    driver: bridge
