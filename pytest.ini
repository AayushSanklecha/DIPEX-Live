[pytest]
# ── Warnings ──────────────────────────────────────────────────────────────────
# Suppress all third-party warnings so the test output is clean.
# Source-level deprecations in DIPEX code are fixed; remaining warnings are
# from transitive dependencies (pydantic v1→v2 migration, pandas freq aliases,
# sklearn, pyasn1, etc.) that we have no control over at this time.
filterwarnings =
    # ── Pandas ──────────────────────────────────────────────────────────────
    ignore::FutureWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    # ── Pydantic (v1 compatibility shims still used by some libraries) ────
    ignore::UserWarning
    # ── Sklearn ──────────────────────────────────────────────────────────────
    ignore::RuntimeWarning
    # ── Catch-all for any remaining internal warnings ─────────────────────
    ignore::ResourceWarning

# ── Test discovery ────────────────────────────────────────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── Output ────────────────────────────────────────────────────────────────────
# Show extra test summary info for all but passed tests
addopts = -ra --tb=short -m "not integration" --ignore=tests/legacy/

# ── Strict markers ────────────────────────────────────────────────────────────
# Prevent undefined marks from silently passing
markers =
    unit: Unit tests
    integration: Integration tests (requires live services e.g. Kafka, Redis)
    slow: Slow tests (> 5s)
    security: Security tests
    streaming: Streaming ingestion tests
    rl: Reinforcement learning / bandit tests
    legacy: Legacy tests — expected failures from deprecated v1/v2 components
    core: Core pipeline tests — must pass 100%% in CI
