groups:
  - name: dipex_pipeline_alerts
    rules:
      # ── Pipeline SLA ──────────────────────────────────────────────────────────
      - alert: PipelineHighFailureRate
        expr: |
          (
            sum(rate(dipex_gate_decisions_total{decision="REJECT"}[5m]))
            /
            sum(rate(dipex_pipeline_runs_total[5m]))
          ) > 0.20
        for: 2m
        labels:
          severity: critical
          team: data_platform
        annotations:
          summary: "DIPEX pipeline failure rate > 20%"
          description: >
            More than 20% of pipeline runs are failing Hard Gate validation.
            Check data quality, source schema, or domain rule config.

      - alert: PipelineLatencyHigh
        expr: |
          histogram_quantile(0.95, rate(dipex_pipeline_duration_seconds_bucket[10m])) > 300
        for: 5m
        labels:
          severity: warning
          team: data_platform
        annotations:
          summary: "DIPEX p95 pipeline latency > 5 minutes"
          description: "P95 pipeline duration exceeded 300s. Check compute resources and LLM timeouts."

      # ── Confidence Score ──────────────────────────────────────────────────────
      - alert: LowConfidenceScoreDistribution
        expr: |
          histogram_quantile(0.50, rate(dipex_confidence_score_bucket[15m])) < 0.70
        for: 5m
        labels:
          severity: warning
          team: data_platform
        annotations:
          summary: "DIPEX median confidence score < 70%"
          description: >
            The median confidence score across recent runs is below 0.70.
            Retry budget may be exhausted frequently. Review data quality.

      # ── Retry Engine ──────────────────────────────────────────────────────────
      - alert: HighRetryEscalationRate
        expr: |
          increase(dipex_retry_escalations_total[1h]) > 5
        for: 0m
        labels:
          severity: warning
          team: data_platform
        annotations:
          summary: "DIPEX: 5+ retry escalations in the last hour"
          description: "Retry budget repeatedly exhausted. Investigate source data quality or gate thresholds."

      # ── RL Safety ─────────────────────────────────────────────────────────────
      - alert: RLSafetyViolationDetected
        expr: |
          increase(dipex_rl_safety_violations_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
          team: ml_platform
        annotations:
          summary: "DIPEX RL safety violation detected"
          description: >
            The RL engine attempted to write to a forbidden target.
            RLSafetyViolation raised and blocked. Investigate RL policy drift.

      - alert: RLInstabilityRollback
        expr: |
          increase(dipex_rl_rollbacks_total[30m]) > 2
        for: 0m
        labels:
          severity: warning
          team: ml_platform
        annotations:
          summary: "DIPEX RL instability rollbacks: 2+ in 30 minutes"
          description: "RL detected confidence regression >0.10 over 3 episodes and triggered checkpoint rollback."

      # ── Drift ─────────────────────────────────────────────────────────────────
      - alert: SevereDriftDetected
        expr: |
          increase(dipex_drift_detected_total{severity="severe"}[10m]) > 0
        for: 0m
        labels:
          severity: critical
          team: data_platform
        annotations:
          summary: "DIPEX: severe data drift detected"
          description: "PSI or KL-divergence has exceeded the severe threshold. Validate upstream data source immediately."

      - alert: ModerateDriftSustained
        expr: |
          sum(rate(dipex_drift_detected_total{severity="moderate"}[30m])) > 0.1
        for: 10m
        labels:
          severity: warning
          team: data_platform
        annotations:
          summary: "DIPEX: sustained moderate data drift over 30 minutes"
          description: "Moderate drift has persisted. Consider triggering retraining pipeline."

      # ── LLM Cost ─────────────────────────────────────────────────────────────
      - alert: LLMTokenBudgetExceeded
        expr: |
          increase(dipex_llm_tokens_total[1h]) > 500000
        for: 0m
        labels:
          severity: warning
          team: ml_platform
        annotations:
          summary: "DIPEX LLM: >500K tokens consumed in 1 hour"
          description: "Token usage spike detected. Verify prompt sizes and check for runaway batch jobs."

      - alert: LLMGovernanceBlockSpike
        expr: |
          increase(dipex_llm_governance_blocks_total[15m]) > 3
        for: 0m
        labels:
          severity: warning
          team: ml_platform
        annotations:
          summary: "DIPEX LLM: 3+ governance blocks in 15 minutes"
          description: "Multiple LLM requests blocked because gate_decision != PASS. Source data may be failing gates."

      # ── Streaming ─────────────────────────────────────────────────────────────
      - alert: KafkaConsumerLagHigh
        expr: |
          dipex_streaming_consumer_lag_messages > 1000
        for: 5m
        labels:
          severity: warning
          team: data_platform
        annotations:
          summary: "DIPEX Kafka consumer lag > 1000 messages"
          description: "Consumer is falling behind. Check processing throughput and Kafka broker health."

      - alert: KafkaConsumerLagCritical
        expr: |
          dipex_streaming_consumer_lag_messages > 10000
        for: 2m
        labels:
          severity: critical
          team: data_platform
        annotations:
          summary: "DIPEX Kafka consumer lag > 10,000 messages — CRITICAL"
          description: "Consumer severely behind. Backpressure active. Scale consumers or pause ingestion."

      # ── QA Gate Failures ──────────────────────────────────────────────────────
      - alert: Gate1QAFailureSpike
        expr: |
          sum(rate(dipex_qa_failures_total{gate="1"}[5m])) > 0.5
        for: 3m
        labels:
          severity: warning
          team: data_platform
        annotations:
          summary: "DIPEX Gate 1 QA failures exceeding 0.5/s"
          description: "Multiple Hard Gate 1 check failures. Review incoming data schema or regulatory rule config."

  - name: dipex_infrastructure_alerts
    rules:
      # ── API Health ────────────────────────────────────────────────────────────
      - alert: APIDown
        expr: |
          up{job="dipex-api"} == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "DIPEX API is down"
          description: "Prometheus cannot scrape dipex-api. Service may be crashed or unreachable."

      - alert: APIHighErrorRate
        expr: |
          sum(rate(dipex_stage_failures_total[5m])) > 10
        for: 2m
        labels:
          severity: warning
          team: platform
        annotations:
          summary: "DIPEX API: >10 stage failures/s across all stages"
          description: "High stage failure rate. Check logs for exceptions or misconfiguration."
